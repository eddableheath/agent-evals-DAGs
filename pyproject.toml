[project]
name = "agent-evals-DAGs"
version = "0.1.0"
description = "Counterfactual interventions on agent reasoning: does evaluation-awareness causally drive covert behaviour?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dag = ["networkx>=3.2", "dowhy>=0.11"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfscheming", "src/cfdag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
